<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Free Mapper</title>
<style>
  :root{
    --bg:#000;--panel:#06080a;--panel2:#0c0f12;--line:rgba(255,255,255,.24);--line-dim:rgba(255,255,255,.09);
    --text:#e6e8ea;--muted:#6f7782;--accent:#3fe873;--accent-dim:#1e7a41;
    --live:#8dff9b;--warn:#ff6b6b;--pink:#ff5ec4;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;--sans:var(--mono);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);
    font-family:var(--mono);color:var(--text);-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;background:#000;cursor:default;z-index:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #gl{z-index:1}#ui{z-index:2}

  /* corner registration marks on framed panels */
  #bar,#panel,#videoBar{position:fixed}
  #bar::before,#panel::before,#videoBar::before,
  #bar::after,#panel::after,#videoBar::after{content:"";position:absolute;width:8px;height:8px;pointer-events:none;z-index:2}
  #bar::before,#panel::before,#videoBar::before{top:4px;left:4px;border-top:1px solid var(--accent);border-left:1px solid var(--accent)}
  #bar::after,#panel::after,#videoBar::after{bottom:4px;right:4px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent)}

  #bar{z-index:20;top:10px;left:10px;right:10px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;
    padding:8px 10px;border:1px solid var(--line);background:var(--panel)}
  .brand{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text);padding:0 12px 0 2px;white-space:nowrap;font-weight:700}
  .brand .logo{color:var(--accent);flex:none;display:block}
  #statusBar .logo{color:var(--accent);flex:none;display:block}
  .grp{display:flex;gap:4px;align-items:center;padding:0 6px;border-left:1px solid var(--line-dim)}
  .grp:first-of-type{border-left:0}.spacer{flex:1}
  button{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text);
    background:transparent;border:1px solid var(--line);padding:7px 10px;border-radius:0;cursor:pointer;transition:.1s;white-space:nowrap;line-height:1}
  button:hover{background:rgba(255,255,255,.10);border-color:var(--text)}
  button:active{background:var(--text);color:#000}
  button.on{background:var(--accent);color:#000;border-color:var(--accent)}
  button.icon{padding:7px 8px;min-width:30px;text-align:center;font-size:12px}
  button.danger:hover{background:var(--warn);color:#000;border-color:var(--warn)}
  button.live{background:var(--live);color:#04140a;border-color:var(--live);font-weight:700;letter-spacing:.1em}
  button.live:hover{filter:brightness(1.08);color:#04140a}
  button.cta{background:var(--accent);color:#021015;border-color:var(--accent);font-weight:700}
  button.cta:hover{filter:brightness(1.08)}
  button.pink{border-color:rgba(255,94,196,.5);color:var(--pink)}
  button.pink:hover{background:rgba(255,94,196,.14);border-color:var(--pink)}
  body.inputmode button.pink{background:var(--pink);color:#160210;border-color:var(--pink)}
  body.inputmode #modeOut{background:transparent;color:var(--text);border-color:var(--line)}
  button:disabled{opacity:.28;cursor:not-allowed}button:disabled:hover{background:transparent;border-color:var(--line)}
  select{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text);background:var(--panel2);
    border:1px solid var(--line);padding:7px 8px;border-radius:0;cursor:pointer}
  .readout{font-size:11px;color:var(--accent);min-width:54px;text-align:center;letter-spacing:.04em}
  label.rng{display:flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  input[type=range]{accent-color:var(--accent);width:68px;height:3px}

  #panel{z-index:19;left:10px;top:62px;bottom:38px;width:240px;display:flex;flex-direction:column;
    border:1px solid var(--line);background:var(--panel);overflow:hidden}
  #panel h2{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:11px 12px 9px;border-bottom:1px solid var(--line-dim);flex:none}
  #panel h2::before{content:"// "}
  #list{overflow-y:auto;padding:6px;flex:1;min-height:60px}
  .row{display:flex;align-items:center;gap:2px;padding:5px 5px;margin-bottom:2px;border:1px solid transparent;cursor:pointer}
  .row:hover{background:rgba(255,255,255,.05)}
  .row.sel{background:rgba(63,232,115,.12);border-color:var(--accent-dim)}
  .row .nm{flex:1;font-size:11px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
  .row.hidden .nm{color:var(--muted);text-decoration:line-through}
  .row button{padding:3px 4px;font-size:11px;min-width:20px;background:transparent;border:0;color:var(--muted)}
  .row button:hover{color:var(--accent);background:rgba(63,232,115,.14)}
  .row button.act{color:var(--accent)}.row button.lk.act{color:var(--warn)}

  #props{padding:8px;border-top:1px solid var(--line-dim);flex:none}
  .prow{display:flex;align-items:center;gap:6px;padding:5px 3px}
  .plabel{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);width:72px;flex:none}
  .prow input[type=range]{flex:1;min-width:0}
  .prow .readout{min-width:0;flex:1}
  #shareBtn{flex:1}

  #toast{position:fixed;z-index:40;left:50%;top:16px;transform:translateX(-50%);font-size:11px;color:#04140a;letter-spacing:.08em;text-transform:uppercase;
    background:var(--live);padding:9px 18px;border-radius:0;opacity:0;transition:opacity .35s;pointer-events:none}
  #toast.show{opacity:1}
  #videoBar{z-index:18;left:50%;bottom:34px;transform:translateX(-50%);display:none;align-items:center;gap:9px;
    padding:8px 11px;border:1px solid var(--line);background:var(--panel)}
  #videoBar.show{display:flex}
  #vbTrack{width:240px;height:5px;background:rgba(255,255,255,.14);cursor:pointer;position:relative}
  #vbFill{position:absolute;left:0;top:0;height:100%;background:var(--accent);width:0}

  /* bottom telemetry bar */
  #statusBar{position:fixed;z-index:17;left:0;right:0;bottom:0;height:24px;display:flex;align-items:center;gap:0;
    background:var(--panel);border-top:1px solid var(--line);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  #statusBar .seg{padding:0 12px;height:100%;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line-dim);white-space:nowrap}
  #statusBar .seg b{color:var(--text);font-weight:400}
  #statusBar .seg.k{color:var(--accent)}
  #statusBar .grow{flex:1;border-right:0}
  #statusBar .right{border-right:0;border-left:1px solid var(--line-dim);color:var(--text)}

  #themeSw{gap:7px}
  #themeSw .sw{width:11px;height:11px;border:1px solid rgba(255,255,255,.35);cursor:pointer;display:inline-block}
  #themeSw .sw.on{outline:1.5px solid #fff;outline-offset:1px}
  body.live #bar,body.live #panel,body.live #ui,body.live #videoBar,body.live #statusBar{display:none}
  body.live #stage{cursor:none}
  #play{position:fixed;z-index:30;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);cursor:pointer}
  #play.show{display:grid}
  #play div{font-family:var(--mono);color:var(--accent);font-size:13px;border:1px solid var(--accent);padding:14px 22px;letter-spacing:.08em;text-transform:uppercase}
  .hide{display:none!important}
</style>
</head>
<body>
  <div id="stage"><canvas id="gl"></canvas><canvas id="ui"></canvas></div>

  <div id="bar">
    <span class="brand"><svg class="logo" viewBox="180.9 926.8 169.2 216" width="13.32" height="17" aria-hidden="true"><path d="M320.76,1002.2h-39.93v-46.1c0-12.32-9.98-22.3-22.3-22.3h-48.33c-12.32,0-22.3,9.98-22.3,22.3v88.34c0,12.32,9.98,22.3,22.3,22.3h39.93v46.1c0,12.32,9.98,22.3,22.3,22.3h48.33c12.32,0,22.3-9.98,22.3-22.3v-88.34c0-12.32-9.98-22.3-22.3-22.3ZM336.21,1113.46c0,8.4-6.81,15.22-15.22,15.22h-48.81c-8.4,0-15.22-6.81-15.22-15.22v-89.58c0-8.4,6.81-15.22,15.22-15.22h48.81c8.4,0,15.22,6.81,15.22,15.22v89.58Z" fill="currentColor" stroke="currentColor" stroke-width="14" stroke-miterlimit="10"/></svg><span>Free&nbsp;Mapper</span></span>
    <div class="grp">
      <button id="modeOut" class="on" title="Output: Projektionsflächen mappen (cyan)">Output</button>
      <button id="modeIn" class="pink" title="Input: Quellbereich des Mediums festlegen (pink)">Input</button>
    </div>
    <div class="grp">
      <select id="newSel" title="Neue Fläche oder Form anlegen">
        <option value="">+ Neu …</option><option value="quad">Fläche (Quad)</option><option value="pen">Pen-Tool</option>
        <option value="rect">Rechteck</option><option value="tri">Dreieck</option><option value="circle">Kreis</option>
        <option value="pent">Fünfeck</option><option value="hex">Sechseck</option><option value="star">Stern</option>
      </select>
    </div>
    <div class="grp">
      <button id="imgBtn">Bild</button><button id="vidBtn">Video</button>
      <select id="mediaSel" title="Generierte Inhalte">
        <option value="">Generator …</option>
        <optgroup label="Testbild">
          <option value="test:grid">Raster</option><option value="test:cross">Fadenkreuz</option>
          <option value="test:circles">Fokus-Kreise</option><option value="test:bars">Farbbalken</option><option value="test:white">Weiß (Fokus)</option>
        </optgroup>
        <optgroup label="Animation">
          <option value="gen:clouds">Wolken</option><option value="gen:plasma">Plasma</option><option value="gen:waves">Wellen</option>
          <option value="gen:ripples">Ringe</option><option value="gen:lightning">Blitze</option><option value="gen:stripes">Streifen</option><option value="gen:static">Rauschen</option>
        </optgroup>
      </select>
      <button id="replaceBtn" title="Aktiv: geladenes Medium ersetzt die ausgewählte Fläche statt eine neue anzulegen">Ersetzen</button>
    </div>
    <div class="grp"><button id="snapBtn" class="on" title="An anderen Punkten/Kanten einrasten">Snap</button></div>
    <div class="spacer"></div>
    <div class="grp">
      <button id="undoBtn" class="icon" title="Rückgängig (⌘Z)">↶</button><button id="redoBtn" class="icon" title="Wiederholen (⇧⌘Z)">↷</button>
      <button id="saveBtn">Speichern</button><button id="loadBtn">Laden</button>
    </div>
    <div class="grp"><button id="fsBtn">Vollbild</button><button id="liveBtn" class="live">Live Mode</button></div>
  </div>

  <div id="panel">
    <h2>Flächen</h2><div id="list"></div>
    <h2>Eigenschaften</h2>
    <div id="props">
      <div class="prow"><span class="plabel">Mesh / Punkte</span>
        <button id="meshMinus" class="icon" disabled>–</button><span class="readout" id="meshRead">—</span><button id="meshPlus" class="icon" disabled>+</button></div>
      <div class="prow"><span class="plabel">Licht</span><input type="range" id="bright" min="0" max="150" value="100" disabled></div>
      <div class="prow"><span class="plabel">Deckkraft</span><input type="range" id="opacity" min="0" max="100" value="100" disabled></div>
      <div class="prow"><span class="plabel">Spiegeln</span>
        <button id="flipH" class="icon" disabled title="Horizontal spiegeln">⇆</button>
        <button id="flipV" class="icon" disabled title="Vertikal spiegeln">⇅</button></div>
      <div class="prow"><span class="plabel">Maske</span>
        <button id="maskAdd" disabled title="Maske hinzufügen (stanzt Bereich aus)">+ Maske</button>
        <button id="maskDel" disabled title="Letzte Maske entfernen">−</button></div>
      <div class="prow"><span class="plabel">Video</span>
        <button id="shareBtn" disabled title="Video synchron auf weiterer Fläche">Teilen / Sync</button></div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="statusBar">
    <div class="seg k"><svg class="logo" viewBox="180.9 926.8 169.2 216" width="9.4" height="12" aria-hidden="true"><path d="M320.76,1002.2h-39.93v-46.1c0-12.32-9.98-22.3-22.3-22.3h-48.33c-12.32,0-22.3,9.98-22.3,22.3v88.34c0,12.32,9.98,22.3,22.3,22.3h39.93v46.1c0,12.32,9.98,22.3,22.3,22.3h48.33c12.32,0,22.3-9.98,22.3-22.3v-88.34c0-12.32-9.98-22.3-22.3-22.3ZM336.21,1113.46c0,8.4-6.81,15.22-15.22,15.22h-48.81c-8.4,0-15.22-6.81-15.22-15.22v-89.58c0-8.4,6.81-15.22,15.22-15.22h48.81c8.4,0,15.22,6.81,15.22,15.22v89.58Z" fill="currentColor" stroke="currentColor" stroke-width="14" stroke-miterlimit="10"/></svg>FREE·MAPPER</div>
    <div class="seg">SURF <b id="stSurf">0</b></div>
    <div class="seg">SEL <b id="stSel">—</b></div>
    <div class="seg">CROP <b id="stCrop">—</b></div>
    <div class="seg grow" id="stHint"></div>
    <div class="seg" id="themeSw"><span class="sw" data-c="#4dd9e6" style="background:#4dd9e6"></span><span class="sw" data-c="#2ea35a" style="background:#2ea35a"></span><span class="sw" data-c="#9e2b2b" style="background:#9e2b2b"></span><span class="sw" data-c="#a78bfa" style="background:#a78bfa"></span><span class="sw" data-c="#ff8a4d" style="background:#ff8a4d"></span><span class="sw" data-c="#e6e8ea" style="background:#e6e8ea"></span></div>
    <div class="seg">SRC <b id="stRes">—</b></div>
    <div class="seg">FPS <b id="stFps">0</b></div>
    <div class="seg right" id="stClock">--:--:--</div>
  </div>
  <div id="videoBar">
    <button id="vbPlay" class="icon">⏸</button><button id="vbStart" class="icon" title="An den Anfang">⏮</button>
    <div id="vbTrack"><div id="vbFill"></div></div>
    <span id="vbTime" class="readout" style="min-width:86px">0:00 / 0:00</span>
    <button id="vbLoop" class="icon on" title="Endlosschleife">⟳</button>
  </div>
  <div id="play"><div>Klicken, um Video zu starten</div></div>

  <input id="imgFile" type="file" accept="image/*" class="hide">
  <input id="vidFile" type="file" accept="video/*" class="hide">
  <input id="projFile" type="file" accept="application/json,.json" class="hide">

<script>
"use strict";
let ACC='#4dd9e6',ACCR='77,217,230';
const THEMES=['#4dd9e6','#2ea35a','#9e2b2b','#a78bfa','#ff8a4d','#e6e8ea'];
function setTheme(hex){ACC=hex;const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  ACCR=r+','+g+','+b;
  document.documentElement.style.setProperty('--accent',hex);
  document.documentElement.style.setProperty('--accent-dim','rgb('+Math.round(r*.45)+','+Math.round(g*.45)+','+Math.round(b*.45)+')');
  document.querySelectorAll('#themeSw .sw').forEach(el=>el.classList.toggle('on',el.dataset.c===hex));
  try{localStorage.setItem('bm-theme',hex);}catch(e){}}
window.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('#themeSw .sw').forEach(el=>el.onclick=()=>setTheme(el.dataset.c));
  let t=null;try{t=localStorage.getItem('bm-theme');}catch(e){}
  setTheme(THEMES.includes(t)?t:THEMES[0]);});

const $=id=>document.getElementById(id);
const stage=$('stage'),glc=$('gl'),uic=$('ui'),ctx=uic.getContext('2d');
const gl=glc.getContext('webgl',{premultipliedAlpha:false,alpha:false,stencil:true});
if(!gl){document.body.innerHTML='<div style="padding:40px;font-family:monospace;color:#fff">Dein Browser unterstützt kein WebGL. Bitte Safari/Chrome aktuell halten.</div>';throw 0;}

/* shaders */
const VS=`attribute vec2 a_pos;attribute vec3 a_uvq;varying vec3 v_uvq;void main(){gl_Position=vec4(a_pos,0.,1.);v_uvq=a_uvq;}`;
const FS=`precision mediump float;uniform sampler2D u_tex;uniform float u_op;uniform float u_b;varying vec3 v_uvq;
void main(){vec2 uv=v_uvq.xy/v_uvq.z;vec4 c=texture2D(u_tex,uv);gl_FragColor=vec4(c.rgb*u_b,c.a*u_op);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);gl.useProgram(prog);
const A_POS=gl.getAttribLocation(prog,'a_pos'),A_UVQ=gl.getAttribLocation(prog,'a_uvq');
const U_TEX=gl.getUniformLocation(prog,'u_tex'),U_OP=gl.getUniformLocation(prog,'u_op'),U_B=gl.getUniformLocation(prog,'u_b');
const posBuf=gl.createBuffer(),uvqBuf=gl.createBuffer();
gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.clearColor(0,0,0,1);

/* state */
let surfaces=[],selected=null,op=null,opUndo=false,uid=1,snap=true,replaceMode=false,active=null,penMode=false,penPts=[],penMouse=null;
let undoStack=[],redoStack=[],lastNudge=0;

function makeTex(){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([20,22,26,255]));return t;}
const MAXTEX=gl.getParameter(gl.MAX_TEXTURE_SIZE)||4096;
function uploadEl(tex,el){gl.bindTexture(gl.TEXTURE_2D,tex);
  const w=el.naturalWidth||el.videoWidth||el.width||1,h=el.naturalHeight||el.videoHeight||el.height||1;
  if(w>MAXTEX||h>MAXTEX){const sc=MAXTEX/Math.max(w,h),cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(w*sc));cv.height=Math.max(1,Math.round(h*sc));cv.getContext('2d').drawImage(el,0,0,cv.width,cv.height);
    try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);}catch(e){}}
  else try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,el);}catch(e){}}
function regrid(TL,TR,BL,BR,cols,rows){const p=[];for(let r=0;r<=rows;r++){const v=r/rows;for(let c=0;c<=cols;c++){const u=c/cols;
  const tx=TL.x+(TR.x-TL.x)*u,ty=TL.y+(TR.y-TL.y)*u,bx=BL.x+(BR.x-BL.x)*u,by=BL.y+(BR.y-BL.y)*u;
  p.push({x:tx+(bx-tx)*v,y:ty+(by-ty)*v});}}return p;}
function gridPoints(cols,rows,cx,cy,hw,hh){return regrid({x:cx-hw,y:cy-hh},{x:cx+hw,y:cy-hh},{x:cx-hw,y:cy+hh},{x:cx+hw,y:cy+hh},cols,rows);}
function corners(s){const N=s.cols,M=s.rows,p=s.points;return{TL:p[0],TR:p[N],BL:p[M*(N+1)],BR:p[M*(N+1)+N]};}
function isCornerIdx(s,i){return i===0||i===s.cols||i===s.rows*(s.cols+1)||i===s.rows*(s.cols+1)+s.cols;}
function centroid(s){let x=0,y=0;for(const p of s.points){x+=p.x;y+=p.y;}return{x:x/s.points.length,y:y/s.points.length};}
function surfaceAspect(s){const c=gcorners(s),TL=px(c.TL),TR=px(c.TR),BR=px(c.BR),BL=px(c.BL);
  const wd=(Math.hypot(TR[0]-TL[0],TR[1]-TL[1])+Math.hypot(BR[0]-BL[0],BR[1]-BL[1]))/2;
  const ht=(Math.hypot(BL[0]-TL[0],BL[1]-TL[1])+Math.hypot(BR[0]-TR[0],BR[1]-TR[1]))/2;
  return Math.max(.25,Math.min(4,wd/Math.max(1,ht)));}

/* polygon surfaces (pen tool + basic shapes) */
function bbox(s){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of s.points){a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y);}
  return{minx:a,miny:b,maxx:c,maxy:d,w:Math.max(1e-6,c-a),h:Math.max(1e-6,d-b)};}
function outline(s){if(s.kind==='poly')return smoothOutline(s);const c=corners(s);return[c.TL,c.TR,c.BR,c.BL];}
function polyHash(s){let h=s.points.length*13;
  for(const p of s.points)h=h*1.0000001+p.x*997+p.y*1409+(p.hx||0)*211+(p.hy||0)*631;return h;}
function smoothOutline(s){const p=s.points,n=p.length;

  const bin=atob(b64),u8=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);return new Blob([u8],{type:mime});}
async function exportProject(){const out=[],seen={};for(const s of surfaces){const lid=s.media.linkId||null;
  const g={id:s.id,name:s.name,kind:s.kind,cols:s.cols,rows:s.rows,
  points:s.points.map(p=>({x:+p.x.toFixed(5),y:+p.y.toFixed(5),hx:p.hx?+p.hx.toFixed(5):undefined,hy:p.hy?+p.hy.toFixed(5):undefined})),op:s.op,bright:s.bright,flipH:s.flipH,flipV:s.flipV,visible:s.visible,locked:s.locked,
  masks:s.masks?s.masks.map(mk=>({points:mk.points.map(p=>({x:+p.x.toFixed(5),y:+p.y.toFixed(5)}))})):null,input:s.input?{cols:s.input.cols,rows:s.input.rows,pts:s.input.pts.map(p=>({x:+p.x.toFixed(5),y:+p.y.toFixed(5)}))}:null,media:{type:s.media.type,pattern:s.media.pattern,crop:{...s.media.crop},linkId:lid}};
  if(s.media.type==='image')g.media.data=s.media.src;
  else if(s.media.type==='video'&&s.media.file){if(lid&&seen[lid])g.media.linkRef=lid;else{g.media.data=await blobToB64(s.media.file);if(lid)seen[lid]=true;}}
  out.push(g);}return{v:5,surfaces:out};}
function importProject(d){surfaces=[];selected=null;const groups={},dataByLink={};
  for(const sd of(d.surfaces||[])){const m=sd.media||{},lid=m.linkId||m.linkRef||null;
    const s={id:sd.id||uid++,name:sd.name||'Fläche',kind:sd.kind||'grid',cols:sd.cols||1,rows:sd.rows||1,points:sd.points.map(p=>({x:p.x,y:p.y,hx:p.hx||0,hy:p.hy||0})),
      op:sd.op??1,bright:sd.bright??1,flipH:!!sd.flipH,flipV:!!sd.flipV,visible:sd.visible!==false,locked:!!sd.locked,
      masks:sd.masks?sd.masks.map(mk=>({points:mk.points.map(p=>({x:p.x,y:p.y}))})):null,input:sd.input?{cols:sd.input.cols,rows:sd.input.rows,pts:sd.input.pts.map(p=>({x:p.x,y:p.y}))}:null,media:{type:'none',tex:makeTex(),w:1,h:1,el:null,src:null,pattern:null,file:null,linkId:lid,crop:m.crop?{...m.crop}:{x:0,y:0,w:1,h:1}}};
    surfaces.push(s);
    if(m.type==='image'){const src=m.data||m.src;if(src)loadImage(s,src,true);}
    else if(m.type==='test')loadTest(s,m.pattern||'grid',true);
    else if(m.type==='gen')loadGen(s,m.pattern||'clouds',true);
    else if(m.type==='video'){if(lid){(groups[lid]=groups[lid]||[]).push(s);if(m.data&&!dataByLink[lid])dataByLink[lid]=m.data;}
      else if(m.data){try{loadVideo(s,dataURLtoBlob(m.data),true);}catch(e){}}}}
  for(const lid in groups){const data=dataByLink[lid];if(!data)continue;const blob=dataURLtoBlob(data),url=URL.createObjectURL(blob),grp=groups[lid];
    const v=document.createElement('video');v.src=url;v.loop=true;v.muted=true;v.playsInline=true;
    v.addEventListener('loadeddata',()=>{grp.forEach(su=>{su.media.type='video';su.media.el=v;su.media.file=blob;su.media.w=v.videoWidth;su.media.h=v.videoHeight;});buildPanel();refreshUI();});
    grp.forEach(su=>{su.media.el=v;su.media.file=blob;});v.play().catch(()=>$('play').classList.add('show'));}
  if(surfaces.length)uid=Math.max(uid,...surfaces.map(s=>s.id))+1;selected=surfaces[surfaces.length-1]||null;undoStack=[];redoStack=[];buildPanel();refreshUI();}
$('saveBtn').onclick=async()=>{const btn=$('saveBtn'),t=btn.textContent;btn.disabled=true;btn.textContent='Speichere…';
  try{const data=await exportProject();const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='free-mapper.bmap.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
  catch(err){alert('Speichern fehlgeschlagen: '+err.message);}finally{btn.disabled=false;btn.textContent=t;}};
$('loadBtn').onclick=()=>$('projFile').click();
$('projFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{importProject(JSON.parse(rd.result));}catch(err){alert('Datei konnte nicht geladen werden.');}};rd.readAsText(f);e.target.value='';};

/* boot */
resize();addSurface();loadTest(selected,'grid');refreshUI();render();
</script>
